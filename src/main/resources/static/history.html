<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocation History - Smart Hospital Resource Allocation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-brand">
                <i class="bi bi-hospital"></i>
                <span>SmartHospital</span>
            </a>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="patients.html" class="sidebar-link">
                    <i class="bi bi-people"></i>
                    <span>Patients</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="beds.html" class="sidebar-link">
                    <i class="bi bi-hospital-bed"></i>
                    <span>Beds</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="equipment.html" class="sidebar-link">
                    <i class="bi bi-tools"></i>
                    <span>Equipment</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="allocation.html" class="sidebar-link">
                    <i class="bi bi-cpu"></i>
                    <span>Smart Allocation</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="history.html" class="sidebar-link active">
                    <i class="bi bi-clock-history"></i>
                    <span>Allocation History</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-badge mb-2">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-5 text-info"></i>
                    <div>
                        <div class="fw-bold small text-dark" id="loggedInUserName">Admin</div>
                        <small class="text-secondary" style="font-size: 0.75rem;" id="loggedInUserRole">Administrator</small>
                    </div>
                </div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="bi bi-box-arrow-left me-1"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <h5 class="mb-0 fw-bold">Allocation History & Discharge</h5>
            </div>
            <div>
                <a href="allocation.html" class="btn btn-primary">
                    <i class="bi bi-cpu me-1"></i> New Bed Allocation
                </a>
            </div>
        </header>

        <!-- Page Body -->
        <main class="page-container">
            <!-- Alert Box -->
            <div id="pageAlert" class="alert d-none" role="alert"></div>

            <!-- Card Container -->
            <div class="card custom-card">
                <div class="card-header-clean d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-clock-history text-primary fs-5"></i>
                        <span class="fw-bold">All Bed Allocations & Hospital Stays</span>
                    </div>

                    <!-- Filters and Search -->
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <div>
                            <select id="statusFilter" class="form-select form-select-sm">
                                <option value="ALL">All Allocations</option>
                                <option value="ACTIVE">Active Admissions</option>
                                <option value="COMPLETED">Completed (Discharged)</option>
                            </select>
                        </div>
                        <div class="input-group input-group-sm" style="max-width: 250px;">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search patient, bed...">
                        </div>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Patient</th>
                                    <th>Bed Number</th>
                                    <th>Bed Type</th>
                                    <th>Priority</th>
                                    <th>Allocation Date</th>
                                    <th>Stay Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- Populated by history.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap 5 Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/history.js"></script>
</body>
</html>

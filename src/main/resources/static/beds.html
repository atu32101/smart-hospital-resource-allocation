<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beds - Smart Hospital Resource Allocation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-brand">
                <i class="bi bi-hospital"></i>
                <span>SmartHospital</span>
            </a>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="patients.html" class="sidebar-link">
                    <i class="bi bi-people"></i>
                    <span>Patients</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="beds.html" class="sidebar-link active">
                    <i class="bi bi-hospital-bed"></i>
                    <span>Beds</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="allocation.html" class="sidebar-link">
                    <i class="bi bi-cpu"></i>
                    <span>Smart Allocation</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="history.html" class="sidebar-link">
                    <i class="bi bi-clock-history"></i>
                    <span>Allocation History</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-badge mb-2">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-5 text-info"></i>
                    <div>
                        <div class="fw-bold small text-dark" id="loggedInUserName">Admin</div>
                        <small class="text-secondary" style="font-size: 0.75rem;" id="loggedInUserRole">Administrator</small>
                    </div>
                </div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="bi bi-box-arrow-left me-1"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <h5 class="mb-0 fw-bold">Bed Management</h5>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-primary" onclick="openAddBedModal()">
                    <i class="bi bi-plus-circle me-1"></i> Add New Bed
                </button>
            </div>
        </header>

        <!-- Page Body -->
        <main class="page-container">
            <!-- Alert Box -->
            <div id="pageAlert" class="alert d-none" role="alert"></div>

            <!-- Card Container -->
            <div class="card custom-card">
                <div class="card-header-clean d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-hospital-bed text-success fs-5"></i>
                        <span class="fw-bold">Hospital Bed Inventory</span>
                    </div>

                    <!-- Filters and Search -->
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <div>
                            <select id="typeFilter" class="form-select form-select-sm">
                                <option value="ALL">All Bed Types</option>
                                <option value="GENERAL">General</option>
                                <option value="PRIVATE">Private</option>
                                <option value="ICU">ICU</option>
                            </select>
                        </div>
                        <div>
                            <select id="statusFilter" class="form-select form-select-sm">
                                <option value="ALL">All Statuses</option>
                                <option value="AVAILABLE">Available</option>
                                <option value="OCCUPIED">Occupied</option>
                            </select>
                        </div>
                        <div class="input-group input-group-sm" style="max-width: 220px;">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search beds...">
                        </div>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Bed Number</th>
                                    <th>Bed Type</th>
                                    <th>Floor</th>
                                    <th>Status</th>
                                    <th>Assigned Patient</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bedsTableBody">
                                <!-- Populated by beds.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Bed Modal -->
<div class="modal fade" id="bedModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="bedModalTitle">Add New Bed</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="bedError" class="alert alert-danger py-2 d-none" role="alert"></div>
                <form id="bedForm">
                    <input type="hidden" id="bedId">

                    <div class="mb-3">
                        <label for="bedNumber" class="form-label small fw-bold">Bed Number *</label>
                        <input type="text" class="form-control" id="bedNumber" placeholder="e.g. B-106 or ICU-06" required>
                        <small class="text-muted">Must be a unique identifier.</small>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="bedType" class="form-label small fw-bold">Bed Type *</label>
                            <select class="form-select" id="bedType" required>
                                <option value="">Select Type</option>
                                <option value="GENERAL">GENERAL</option>
                                <option value="PRIVATE">PRIVATE</option>
                                <option value="ICU">ICU</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="floor" class="form-label small fw-bold">Floor *</label>
                            <input type="number" class="form-control" id="floor" min="0" max="20" placeholder="e.g. 1" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBedBtn">
                    <i class="bi bi-check2 me-1"></i> Save Bed
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/beds.js"></script>
</body>
</html>

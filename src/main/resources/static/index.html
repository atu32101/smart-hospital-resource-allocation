<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Hospital Resource Allocation System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="container d-flex justify-content-center align-items-center">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-hospital fs-1 d-block mb-2"></i>
                <h4 class="fw-bold mb-1">Smart Hospital System</h4>
                <small class="opacity-75">Resource & Bed Allocation Portal</small>
            </div>
            <div class="login-body-content">
                <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small fw-bold">USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="e.g. admin" value="admin" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted small fw-bold">PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="e.g. admin123" value="admin123" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Portal
                        </button>
                    </div>
                </form>

                <div class="mt-4 p-3 bg-light rounded small border">
                    <div class="fw-bold text-muted mb-2 text-center text-uppercase" style="font-size: 0.75rem;">Select Demo Account to Autofill:</div>
                    <div class="d-flex gap-2 mb-2">
                        <button type="button" class="btn btn-sm btn-outline-primary w-50" onclick="fillCredentials('admin', 'admin123')">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-success w-50" onclick="fillCredentials('staff', 'staff123')">
                            <i class="bi bi-person-badge me-1"></i> Staff
                        </button>
                    </div>
                    <div class="text-center text-muted" style="font-size: 0.78rem;">
                        <strong>Admin:</strong> <code>admin</code> / <code>admin123</code><br>
                        <strong>Staff:</strong> <code>staff</code> / <code>staff123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth-guard.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

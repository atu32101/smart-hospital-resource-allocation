<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Smart Hospital Resource Allocation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-brand">
                <i class="bi bi-hospital"></i>
                <span>SmartHospital</span>
            </a>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="patients.html" class="sidebar-link active">
                    <i class="bi bi-people"></i>
                    <span>Patients</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="beds.html" class="sidebar-link">
                    <i class="bi bi-hospital-bed"></i>
                    <span>Beds</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="equipment.html" class="sidebar-link">
                    <i class="bi bi-tools"></i>
                    <span>Equipment</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="allocation.html" class="sidebar-link">
                    <i class="bi bi-cpu"></i>
                    <span>Smart Allocation</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="history.html" class="sidebar-link">
                    <i class="bi bi-clock-history"></i>
                    <span>Allocation History</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-badge mb-2">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-5 text-info"></i>
                    <div>
                        <div class="fw-bold small text-dark" id="loggedInUserName">Admin</div>
                        <small class="text-secondary" style="font-size: 0.75rem;" id="loggedInUserRole">Administrator</small>
                    </div>
                </div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="bi bi-box-arrow-left me-1"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <h5 class="mb-0 fw-bold">Patient Management</h5>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="bi bi-person-plus-fill me-1"></i> Add New Patient
                </button>
            </div>
        </header>

        <!-- Page Body -->
        <main class="page-container">
            <!-- Alert Box -->
            <div id="pageAlert" class="alert d-none" role="alert"></div>

            <!-- Card Container -->
            <div class="card custom-card">
                <div class="card-header-clean d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-people-fill text-primary fs-5"></i>
                        <span class="fw-bold">All Registered Patients</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="input-group input-group-sm" style="max-width: 280px;">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name, symptom, priority...">
                        </div>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Patient</th>
                                    <th>Phone</th>
                                    <th>Symptoms / Disease</th>
                                    <th>Priority</th>
                                    <th>Required Bed</th>
                                    <th>Status</th>
                                    <th>Registered</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="patientsTableBody">
                                <!-- Populated by patients.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Patient Modal -->
<div class="modal fade" id="patientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="patientModalTitle">Add New Patient</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="patientError" class="alert alert-danger py-2 d-none" role="alert"></div>
                <form id="patientForm">
                    <input type="hidden" id="patientId">

                    <div class="mb-3">
                        <label for="name" class="form-label small fw-bold">Full Name *</label>
                        <input type="text" class="form-control" id="name" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="age" class="form-label small fw-bold">Age *</label>
                            <input type="number" class="form-control" id="age" min="0" max="120" placeholder="e.g. 45" required>
                        </div>
                        <div class="col-6">
                            <label for="gender" class="form-label small fw-bold">Gender *</label>
                            <select class="form-select" id="gender" required>
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label small fw-bold">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="e.g. 9876543210">
                    </div>

                    <div class="mb-3">
                        <label for="symptoms" class="form-label small fw-bold">Symptoms / Disease</label>
                        <textarea class="form-control" id="symptoms" rows="2" placeholder="e.g. Acute chest pain, shortness of breath"></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="priority" class="form-label small fw-bold">Priority Urgency *</label>
                            <select class="form-select" id="priority" required>
                                <option value="">Select Priority</option>
                                <option value="CRITICAL">CRITICAL (Highest)</option>
                                <option value="HIGH">HIGH</option>
                                <option value="MEDIUM">MEDIUM</option>
                                <option value="LOW">LOW</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="requiredBedType" class="form-label small fw-bold">Required Bed Type *</label>
                            <select class="form-select" id="requiredBedType" required>
                                <option value="">Select Bed Type</option>
                                <option value="GENERAL">GENERAL</option>
                                <option value="PRIVATE">PRIVATE</option>
                                <option value="ICU">ICU</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="savePatientBtn">
                    <i class="bi bi-check2 me-1"></i> Save Patient
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/patients.js"></script>
</body>
</html>
